name: Windows Test and Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r admin_source/requirements.txt
          pip install -r admin_source/requirements-build.txt
          pip install -r client_source/requirements.txt
          pip install -r client_source/requirements-build.txt
          pip install pytest

      - name: Release gate
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python scripts/release_check.py

      - name: Build admin executable
        shell: pwsh
        run: |
          Push-Location admin_source
          pyinstaller --clean --noconfirm javanrood.spec
          Pop-Location

      - name: Build client executable
        shell: pwsh
        run: |
          Push-Location client_source
          pyinstaller --clean --noconfirm client.spec
          Pop-Location

      - name: Create portable packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path admin_source/dist/JavanroodNeighborhoodManagement/* -DestinationPath release/Javanrood-v7.6.20-Admin-Portable.zip -Force
          Compress-Archive -Path client_source/dist/JavanroodCommitteeClient/* -DestinationPath release/Javanrood-v7.6.20-Client-Portable.zip -Force

      - name: Build safe admin setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Push-Location admin_source
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion=7.6.20 installer\JavanroodSetup.iss
          Pop-Location
          Copy-Item admin_source/installer/output/JavanroodNeighborhoodManagement_Setup_7.6.20_Windows_x64.exe release/ -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Javanrood-v7.6.20-Windows
          path: release/*
          if-no-files-found: error
